<!DOCTYPE html>
<html>
 <head>
    <title>Trivia Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #5b2c91, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #0f172a;
            color: white;
            width: 500px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }
        #question {
            margin-top: 20px;
            color: #c084fc;
        }
        
    </style>
 </head>
    <body>
        <div class="container">
        <h1 id="title">Welcome to the Trivia Game!</h1>
        <p id="subtitle">
            Test your Developer Knowledge
        </p>

        <button id="startBtn" onclick="startGame()">
            Start Game
        </button>

        <h2 id="question">Question will appear here</h2>
        <div id="answers"></div>

<p id="score">Score: 0</p>
<p id="message"></p>

<button id="nextBtn" style="display:none;">Next Question</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
