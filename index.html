<!DOCTYPE html>
<html>
 <head>
    <title>Trivia Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #5b2c91, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #0f172a;
            color: white;
            width: 600px;
            max-width: 90%;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 0;
            border: none;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }
        #question {
            margin-top: 20px;
            color: #c084fc;
    }
        #answers {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 15px 0;
            margin-top: 20px;
        }
        #answers button {
            width: 100%;
            margin: 0;
        }
        #subtitle {
            font-size: 22px;
            color: #d1d5db;
            margin-bottom: 15px;
        }
        #instructions {
            font-size: 18px;
            color: #d1d5db;
            margin-bottom: 25px;
        }
        
    </style>
 </head>
    <body>
        <div class="container">
        <h1 id="title">Coding Trivia Challenge!</h1>
        <p id="subtitle">
            Test your Developer Knowledge
        </p>
<p id="instructions">
    10 Questions &bullet; HTML &bullet; CSS &bullet; JavaScript
    </p>
        <button id="startBtn" onclick="startGame()">
            Start Game
        </button>

        <h2 id="question"></h2>
        <div id="answers"></div>

<p id="score"></p>
<p id="message"></p>

<button id="nextBtn" style="display:none;">Next Question</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
